name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Enable macOS desktop
        if: runner.os == 'macOS'
        run: flutter config --enable-macos-desktop

      - name: Enable Windows desktop
        if: runner.os == 'Windows'
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Python for packager tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install packager test dependencies
        run: python -m pip install Pillow==11.3.0

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Test Python packager
        env:
          PYTHONPATH: packager
        run: python -m unittest discover -s packager/tests -p 'test_*.py'
