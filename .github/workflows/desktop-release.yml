name: Desktop Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-runtime:
    name: macOS packager runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            python_arch: x64
          - arch: arm64
            runner: macos-14
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.python_arch }}

      - name: Install packager runtime dependencies
        run: python -m pip install --requirement scripts/packager_runtime_requirements.txt

      - name: Build and exercise packager runtime
        env:
          CADILLAC_BUILD_PYTHON: python
        run: ./scripts/build_macos_packager_runtime.sh ${{ matrix.arch }} dist

      - name: Upload packager runtime
        uses: actions/upload-artifact@v4
        with:
          name: packager-runtime-macos-${{ matrix.arch }}
          path: dist/cadillac_wallpaper_packager_${{ matrix.arch }}.tar.gz

  macos-release:
    name: macOS Universal release
    needs: macos-runtime
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build macOS app
        run: flutter build macos --release

      - name: Download both packager runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: packager-runtime-macos-*
          merge-multiple: true
          path: runtime-artifacts

      - name: Package and verify macOS app
        run: |
          shopt -s nullglob
          APPS=(build/macos/Build/Products/Release/*.app)
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "Expected one built .app, found ${#APPS[@]}"
            printf '%s\n' "${APPS[@]}"
            exit 1
          fi
          ./scripts/package_macos_release.sh \
            "${APPS[0]}" runtime-artifacts CadillacPackager-macos-universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CadillacPackager-macos-universal
          path: CadillacPackager-macos-universal.zip

  windows-release:
    name: Windows x64 release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Python for packager runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Build Windows release package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -OutputDir dist

      - name: Verify Windows package
        shell: pwsh
        run: |
          $zipPath = "dist/CadillacPackager-windows-x64.zip"
          if (!(Test-Path $zipPath)) {
            throw "Missing Windows release zip: $zipPath"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "cadillac-windows-release"
          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir

          $required = @(
            "cadillac_wallpaper_desktop.exe",
            "packager_runtime/cadillac_wallpaper_packager.exe",
            "packager_runtime/third_party_licenses/Python-LICENSE.txt",
            "packager_runtime/third_party_licenses/Pillow-LICENSE.txt",
            "packager_runtime/third_party_licenses/PyInstaller-COPYING.txt",
            "packager_runtime/third_party_licenses/RUNTIME-NOTICE.txt",
            "data/flutter_assets/packager/tools/windows/astcenc.exe",
            "data/flutter_assets/packager/templates/BFA3A0F4596C4C57A6BCDC1EB3348932.zip"
          )

          foreach ($relative in $required) {
            $path = Join-Path $extractDir ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (!(Test-Path $path)) {
              throw "Missing required file in Windows release zip: $relative"
            }
          }

          Get-FileHash $zipPath -Algorithm SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CadillacPackager-windows-x64
          path: dist/CadillacPackager-windows-x64.zip
